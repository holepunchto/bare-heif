name: Integrate
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  # TEMPORARY: reproduces the `sfw npm install` failure seen in Prebuild and
  # Publish. Remove once the Windows runner question is settled.
  # `sfw npm install` fails intermittently on windows-2022 while reporting a
  # bogus "npm not found in PATH" — npm is on PATH, and the step burns ~11s
  # before erroring, so this measures the failure rate per runner image.
  # SFW_DEBUG is set at job level so it reaches the step nested in `bare-base`.
  debug-sfw:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
        attempt: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: Debug sfw / ${{ matrix.os }} #${{ matrix.attempt }}
    env:
      SFW_DEBUG: true
    steps:
      - uses: holepunchto/actions/bare-base@v1
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: |
          sudo apt update
          sudo apt install -y meson nasm
        if: ${{ matrix.platform == 'linux' }}
      - run: brew install meson nasm
        if: ${{ matrix.platform == 'darwin' }}
      - run: choco install meson nasm
        if: ${{ matrix.platform == 'win32' }}
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: --debug
      - run: npm test
