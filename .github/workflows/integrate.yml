name: Integrate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            source: true
            flags: --sanitize address
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
        with:
          source: ${{ matrix.source }}
          flags: --debug ${{ matrix.flags }}
      - run: |
          sudo apt update
          sudo apt install -y meson nasm
        if: ${{ matrix.platform == 'linux' }}
      - run: brew install meson nasm
        if: ${{ matrix.platform == 'darwin' }}
      # meson 1.12 breaks the clang-cl sanity check on Windows: it passes
      # c_link_args to the compiler probe without the leading /link.
      - run: |
          choco install meson --version 1.11.0 --allow-downgrade
          choco install nasm
        if: ${{ matrix.platform == 'win32' }}
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: --debug ${{ matrix.flags }}
      - run: npm test
        env:
          LSAN_OPTIONS: suppressions=test/leaks.txt
