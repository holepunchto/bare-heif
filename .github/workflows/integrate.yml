name: Integrate
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  # TEMPORARY: reproduces the `sfw npm install` failure seen in Prebuild and
  # Publish. Remove once the Windows runner question is settled.
  # Mirrors the Prebuild/Publish build job exactly: same `container` key, same
  # arch matrix, and `bare-base` rather than its inner actions, so the failing
  # `sfw npm install` runs nested inside the composite like it does there.
  debug-sfw:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-2022
            arch: arm64
          - os: windows-2025
            arch: x64
          - os: windows-2025
            arch: arm64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: Debug sfw / ${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - name: Locate npm
        if: always()
        shell: bash
        run: |
          echo "sfw:  $(command -v sfw || echo MISSING)"
          echo "npm:  $(command -v npm || echo MISSING)"
          where.exe npm || true
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: |
          sudo apt update
          sudo apt install -y meson nasm
        if: ${{ matrix.platform == 'linux' }}
      - run: brew install meson nasm
        if: ${{ matrix.platform == 'darwin' }}
      - run: choco install meson nasm
        if: ${{ matrix.platform == 'win32' }}
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: --debug
      - run: npm test
